name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # PostgreSQL service containers are supported on Linux runners. The
    # Windows-specific setup scripts are exercised locally by developers.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradebh
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tradeebh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradebh -d tradeebh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tradebh:ci-test-password@localhost:5432/tradeebh_test
      TEST_DATABASE_URL: postgresql+asyncpg://tradebh:ci-test-password@localhost:5432/tradeebh_test
      SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Migrate an empty database to head
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify Alembic is at head
        working-directory: backend
        run: python -m alembic -c alembic.ini current --check-heads
      - name: Run tests
        working-directory: backend
        run: python -m pytest
      - name: Health endpoint smoke test
        working-directory: backend
        run: >-
          python -c "from fastapi.testclient import TestClient; from app.main import app;
          response = TestClient(app).get('/health'); assert response.status_code == 200 and response.json() == {'status': 'ok'}"
