name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # PostgreSQL service containers are supported on Linux runners. The
    # Windows-specific setup scripts are exercised locally by developers.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradebh
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tradeebh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradebh -d tradeebh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tradebh:ci-test-password@localhost:5432/tradeebh_test
      TEST_DATABASE_URL: postgresql+asyncpg://tradebh:ci-test-password@localhost:5432/tradeebh_test
      SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - name: Migrate an empty database to head
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Verify Alembic is at head
        working-directory: backend
        run: python -m alembic -c alembic.ini current --check-heads
      - name: Run tests
        working-directory: backend
        run: python -m pytest
      - name: Health endpoint smoke test
        working-directory: backend
        run: >-
          python -c "from fastapi.testclient import TestClient; from app.main import app;
          response = TestClient(app).get('/health'); assert response.status_code == 200 and response.json() == {'status': 'ok'}"

  frontend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://tradebh:unused@localhost:5432/tradeebh
      SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install OpenAPI generation dependencies
        run: python -m pip install --requirement backend/requirements.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check generated OpenAPI types are fresh
        shell: bash
        run: |
          cd backend
          python -c "import json; from app.main import app; open('/tmp/algoprofitx-openapi.json', 'w').write(json.dumps(app.openapi()))"
          cd ../frontend
          pnpm exec openapi-typescript /tmp/algoprofitx-openapi.json -o /tmp/algoprofitx-openapi.ts
          diff --unified src/api/generated/openapi.ts /tmp/algoprofitx-openapi.ts
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.algoprofitx.com/api/v1
        run: pnpm build

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: >-
          docker build
          --platform linux/amd64
          --build-arg VCS_REF=${{ github.sha }}
          --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          --tag algoprofitx-backend:ci
          backend
      - name: Inspect image contents and runtime user
        shell: bash
        run: |
          test "$(docker image inspect algoprofitx-backend:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh algoprofitx-backend:ci -c \
            'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/.git && test ! -d /app/node_modules'
      - name: Run liveness smoke test
        shell: bash
        run: |
          docker run --detach --rm --name algoprofitx-backend-smoke -p 8000:8000 \
            -e APP_ENV=test \
            -e DATABASE_URL=postgresql+asyncpg://smoke:smoke@127.0.0.1:5432/unused \
            -e SECRET_KEY=ci-smoke-only \
            algoprofitx-backend:ci
          trap 'docker logs algoprofitx-backend-smoke; docker stop algoprofitx-backend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2); assert r.status == 200"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
