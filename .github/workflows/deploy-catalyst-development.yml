name: Deploy Catalyst Development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algoprofitx-development-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: catalyst-development
    env:
      CATALYST_PROJECT_ID: "36851000000392052"
      CATALYST_ORG_ID: "60069781151"
      CATALYST_DC: in
      ZCATALYST_NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build exact-source Linux AMD64 images
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "algoprofitx-api:$GITHUB_SHA" \
            --output "type=docker,dest=$RUNNER_TEMP/algoprofitx-api.tar" backend
          docker buildx build --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=https://api.algoprofitx.com/api/v1 \
            --tag "algoprofitx-web:$GITHUB_SHA" \
            --output "type=docker,dest=$RUNNER_TEMP/algoprofitx-web.tar" frontend
      - name: Verify immutable images
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/algoprofitx-api.tar"
          docker load --input "$RUNNER_TEMP/algoprofitx-web.tar"
          test "$(docker image inspect "algoprofitx-api:$GITHUB_SHA" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "algoprofitx-web:$GITHUB_SHA" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "algoprofitx-api:$GITHUB_SHA" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "algoprofitx-web:$GITHUB_SHA" --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint python "algoprofitx-api:$GITHUB_SHA" --version | grep '^Python 3\.13\.'
          docker run --rm --entrypoint python "algoprofitx-web:$GITHUB_SHA" --version | grep '^Python 3\.13\.'
          docker run --rm --entrypoint sh "algoprofitx-api:$GITHUB_SHA" -c 'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/.git'
          docker run --rm --entrypoint sh "algoprofitx-web:$GITHUB_SHA" -c 'test ! -e /app/.env && test ! -d /app/node_modules && test ! -d /app/.git'
      - name: Install pinned Catalyst CLI
        run: |
          npm install --global --no-audit --no-fund zcatalyst-cli@1.27.2 >/dev/null 2>&1
          test "$(catalyst --version)" = "1.27.2"
      - name: Guard the fixed Development target
        shell: bash
        run: |
          set -euo pipefail
          test "$CATALYST_PROJECT_ID" = "36851000000392052"
          test "$CATALYST_ORG_ID" = "60069781151"
          test "$CATALYST_DC" = "in"
      - name: Deploy exact-source images to Catalyst Development
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile

          token = os.environ.pop("CATALYST_TOKEN")
          assert token, "Temporary deployment token is missing"
          common = [
              "catalyst", "--token", token, "--dc", "in", "--org", "60069781151",
              "--project", "36851000000392052", "--non-interactive",
              "deploy", "appsail",
          ]
          archives = {
              "algoprofitx-api": os.path.join(os.environ["RUNNER_TEMP"], "algoprofitx-api.tar"),
              "algoprofitx-web": os.path.join(os.environ["RUNNER_TEMP"], "algoprofitx-web.tar"),
          }
          with tempfile.TemporaryDirectory() as work:
              for name, archive in archives.items():
                  result = subprocess.run(
                      common + ["--name", name, "--source", "docker-archive://" + archive, "--port", "8000"],
                      cwd=work,
                      capture_output=True,
                      text=True,
                      timeout=900,
                  )
                  success = result.returncode == 0 and "Catalyst AppSail Deploy completed successfully" in result.stdout
                  print(f"{name} Development deployment success: {success}")
                  if not success:
                      raise SystemExit(f"{name} deployment failed; raw output suppressed")
          PY
