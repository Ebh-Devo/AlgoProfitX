services:

  postgres:
    image: postgres:16
    container_name: tradeebh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradebh
      POSTGRES_PASSWORD: tradebh
      POSTGRES_DB: tradeebh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebh -d tradeebh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: tradeebh-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: