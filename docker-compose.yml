# LOCAL TEST TOOLING ONLY. The deployed AlgoProfitX runtime is Zoho Catalyst-only (Data Store +
# ZCQL) and never uses PostgreSQL or Redis. This database backs only the legacy PostgreSQL test
# suite (TEST_DATABASE_URL); it is not a deployment dependency.
services:

  postgres:
    image: postgres:16
    container_name: tradeebh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradebh
      POSTGRES_PASSWORD: tradebh
      POSTGRES_DB: tradeebh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebh -d tradeebh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
